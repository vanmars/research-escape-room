<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case File: Just Mercy Research Clearance</title>
<style>
  :root{
    --paper: #f0e6d2;
    --paper-dark: #e3d5b3;
    --kraft: #d9c9a3;
    --group-fill: #ede3c8;
    --ink: #2b2b24;
    --navy: #1f2a3a;
    --red: #8b1e1e;
    --red-dark: #6b1414;
    --green: #2f5233;
    --gold: #a3792e;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,0.03), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,0.04), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
  }
  .wrap{max-width:800px; margin:0 auto; padding:32px 20px 80px;}

  .clock-bar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--navy); color:var(--paper); font-family:'Courier New',monospace;
    font-size:13px; font-weight:bold; letter-spacing:1px; padding:8px 14px;
    border-radius:6px; margin-bottom:10px; border:2px solid var(--ink);
  }
  .clock-bar #penaltyDisplay{color:#f2a3a3; font-size:11.5px;}

  .folder-tabs{display:flex; gap:5px; margin-bottom:-2px; padding-left:8px; flex-wrap:wrap;}
  .tab{
    flex:1; min-width:70px; text-align:center; padding:7px 4px; font-family:'Courier New', monospace;
    font-size:10.5px; letter-spacing:0.3px; border:2px solid var(--ink); border-bottom:none;
    border-radius:6px 6px 0 0; background:var(--kraft); color:#6b5f45; font-weight:bold;
    transition: background 0.3s, color 0.3s;
  }
  .tab.active{background:var(--navy); color:var(--paper);}
  .tab.done{background:var(--green); color:var(--paper);}

  .folder{
    border:2px solid var(--ink); border-radius:2px 10px 10px 10px;
    background:var(--paper); padding:28px 30px; position:relative;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }

  .stamp{
    position:absolute; top:18px; right:22px; border:3px solid var(--red);
    color:var(--red); font-family:'Courier New', monospace; font-weight:bold;
    font-size:11px; letter-spacing:1px; padding:5px 10px; border-radius:4px;
    transform:rotate(6deg); opacity:0.85; text-align:center;
  }
  .stamp.granted{border-color:var(--green); color:var(--green); transform:rotate(-4deg);}

  h1{font-size:25px; margin:0 0 2px; color:var(--navy); letter-spacing:0.5px;}
  .subtitle{font-family:'Courier New',monospace; font-size:11.5px; color:#7a6f56; margin-bottom:18px; letter-spacing:0.5px;}

  .station-label{
    display:inline-block; background:var(--navy); color:var(--paper);
    font-family:'Courier New',monospace; font-size:11px; padding:4px 10px;
    border-radius:3px; margin-bottom:10px; letter-spacing:1px;
  }

  .notes-intro{font-size:14.5px; line-height:1.5; color:#444; margin-bottom:16px;}

  table.notes-table{width:100%; border-collapse:collapse; margin-bottom:14px; font-size:13.5px;}
  table.notes-table th{background:var(--navy); color:var(--paper); text-align:left; padding:8px 10px; font-size:12.5px;}
  table.notes-table td{border:1px solid #c9bb98; padding:8px 10px; vertical-align:top;}
  table.notes-table td.sym{font-family:'Courier New',monospace; font-weight:bold; color:var(--red); white-space:nowrap; width:110px;}
  table.notes-table tr.group-row td{background:var(--group-fill); font-weight:bold; font-size:11.5px; color:var(--navy); padding:6px 10px;}

  .tip-list{margin:0 0 16px; padding-left:20px; font-size:14.5px; line-height:1.6;}
  .tip-list li{margin-bottom:8px;}

  .callout{background:var(--paper-dark); border-left:4px solid var(--gold); padding:12px 14px; font-size:13.5px; line-height:1.5; margin-bottom:6px;}
  .callout .lbl{font-family:'Courier New',monospace; font-size:10.5px; color:var(--red); font-weight:bold; letter-spacing:1px; display:block; margin-bottom:6px;}

  .prompt{font-size:15.5px; font-weight:bold; margin:6px 0 12px;}
  .q-progress{font-family:'Courier New',monospace; font-size:11px; color:var(--navy); margin-bottom:6px; letter-spacing:0.5px;}

  .options{display:flex; flex-direction:column; gap:9px; margin-bottom:8px;}
  .opt{
    text-align:left; padding:11px 13px; border:2px solid var(--ink); background:#fff;
    border-radius:6px; cursor:pointer; font-family:Georgia,serif; font-size:14.5px;
    transition: background 0.15s, transform 0.1s; line-height:1.4;
  }
  .opt:hover{background:#faf5e8;}
  .opt:active{transform:scale(0.99);}
  .opt.correct{background:#e2efe3; border-color:var(--green);}
  .opt.wrong{background:#f5e2e2; border-color:var(--red);}
  .opt[disabled]{cursor:default;}

  .feedback{margin-top:12px; padding:11px 13px; border-radius:6px; font-size:14px; line-height:1.5; display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:#e2efe3; border:2px solid var(--green); color:var(--green);}
  .feedback.bad{background:#f5e2e2; border:2px solid var(--red); color:var(--red-dark);}

  .code-reveal{margin-top:16px; padding:14px; background:var(--navy); color:var(--paper); border-radius:6px; text-align:center; display:none;}
  .code-reveal.show{display:block;}
  .code-reveal .word{font-family:'Courier New',monospace; font-size:22px; letter-spacing:4px; font-weight:bold; color:#f2c94c;}
  .code-reveal .caption{font-size:11px; letter-spacing:1px; margin-top:4px; opacity:0.8;}

  button.continue{
    margin-top:16px; background:var(--red); color:#fff; border:none; padding:12px 22px;
    border-radius:6px; font-size:14.5px; font-family:Georgia,serif; cursor:pointer;
    display:none; box-shadow:0 3px 0 var(--red-dark);
  }
  button.continue.show{display:inline-block;}
  button.continue:active{box-shadow:none; transform:translateY(3px);}

  .final h1{font-size:29px;}
  .code-trail{display:flex; gap:8px; flex-wrap:wrap; margin:18px 0;}
  .code-chip{font-family:'Courier New',monospace; background:var(--kraft); border:2px solid var(--ink); padding:6px 10px; border-radius:5px; font-size:13px; font-weight:bold;}
  .final-word{font-size:40px; font-family:'Courier New',monospace; letter-spacing:8px; text-align:center; color:var(--red); margin:22px 0; font-weight:bold;}
  .restart{margin-top:20px; background:var(--navy); color:var(--paper); border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-family:Georgia,serif;}
</style>
</head>

          { text: "Stevenson says \"the death of innocent people\" (Stevenson, pg. 15) is a risk of capital punishment.", correct:false, fb:"Citation format should be (Stevenson 15) \u2014 no comma, no \u201cpg.\u201d" },
        ]},
      { prompt: "You know the author's name but could not find any page number (common on websites). How should you cite a quote from them?",
        options: [
          { text: "(Smith, page unknown)", correct:false, fb:"MLA doesn't use placeholder text like this." },
          { text: "(Smith n.d.)", correct:false, fb:"\u201cn.d.\u201d is an APA convention, not MLA." },
          { text: "(Smith)", correct:true, fb:"Correct \u2014 when no page number is available, just use the author's last name." },
          { text: "(Smith, para. 1)", correct:false, fb:"Not the standard format from this guide \u2014 just the author's name alone is expected." },
        ]},
      { prompt: "You're citing a source written by three authors: Green, Diaz, and Nguyen. What's the correct in-text format?",
        options: [
          { text: "(Green, Diaz, and Nguyen 45)", correct:false, fb:"For 3+ authors, MLA doesn't list every name." },
          { text: "(Green et al. 45)", correct:true, fb:"Correct \u2014 first author's last name plus \u201cet al.\u201d for three or more authors." },
          { text: "(Green & Diaz & Nguyen 45)", correct:false, fb:"MLA doesn't use ampersands between author names." },
          { text: "(Green, et al, pg. 45)", correct:false, fb:"Extra comma and \u201cpg.\u201d aren't used in MLA in-text citations." },
        ]},
    ],
  },
];

// ============================================================
// STATE + RENDER
// ============================================================
let stationIdx = 0;
let phase = 'notes'; // 'notes' | 'question'
let questionIdx = 0;
let collected = [];

// --- Clock ---
let startTime = Date.now();
let penaltySeconds = 0;
let clockInterval = null;

function formatTime(totalSeconds){
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function getElapsed(){
  return Math.floor((Date.now() - startTime) / 1000) + penaltySeconds;
}
function tickClock(){
  const el = document.getElementById('clockDisplay');
  if(el) el.textContent = 'TIME: ' + formatTime(getElapsed());
}
function startClock(){
  if(clockInterval) clearInterval(clockInterval);
  clockInterval = setInterval(tickClock, 1000);
  tickClock();
}
function addPenalty(){
  penaltySeconds += 60;
  tickClock();
  const pd = document.getElementById('penaltyDisplay');
  if(pd) pd.textContent = '+' + Math.floor(penaltySeconds/60) + ' min penalty';
}

function renderTabs(){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  stations.forEach((s,i)=>{
    const d = document.createElement('div');
    const isActive = i === stationIdx;
    d.className = 'tab' + (isActive ? ' active' : '') + (i < stationIdx ? ' done' : '');
    d.textContent = 'FILE ' + (i+1);
    tabs.appendChild(d);
  });
}

function renderNotesTable(n){
  let html = `<table class="notes-table"><thead><tr>`;
  n.headers.forEach(h => html += `<th>${h}</th>`);
  html += `</tr></thead><tbody>`;
  n.groups.forEach(g => {
    if(g.label){
      html += `<tr class="group-row"><td colspan="${n.headers.length}">${g.label}</td></tr>`;
    }
    g.rows.forEach(row => {
      html += `<tr>`;
      row.forEach((cell, ci) => {
        html += `<td class="${ci===0 ? 'sym' : ''}">${cell}</td>`;
      });
      html += `</tr>`;
    });
  });
  html += `</tbody></table>`;
  return html;
}

function renderNotesPage(){
  renderTabs();
  const n = notes[stationIdx];
  const f = document.getElementById('folder');
  let bodyHtml = '';
  if(n.preText) bodyHtml += `<p class="notes-intro">${n.preText}</p>`;
  if(n.type === 'table'){
    bodyHtml += renderNotesTable(n);
  } else if(n.type === 'list'){
    bodyHtml += `<ul class="tip-list">` + n.tips.map(t=>`<li>${t}</li>`).join('') + `</ul>`;
  }
  f.innerHTML = `
    <div class="stamp">READ<br>FIRST</div>
    <span class="station-label">STATION ${stationIdx+1} NOTES</span>
    <h1>${n.title}</h1>
    <div class="subtitle">${n.intro}</div>
    ${bodyHtml}
    <div class="callout"><span class="lbl">${n.callout.label}</span>${n.callout.text}</div>
    <button class="continue show" id="notesContinue">I've Read This &rarr; Start Questions</button>
  `;
  document.getElementById('notesContinue').onclick = ()=>{
    phase = 'question';
    questionIdx = 0;
    renderQuestion();
    window.scrollTo(0,0);
  };
}

function renderQuestion(){
  renderTabs();
  const s = stations[stationIdx];
  const q = s.questions[questionIdx];
  const f = document.getElementById('folder');
  f.innerHTML = `
    <div class="stamp">CLEARANCE<br>PENDING</div>
    <span class="station-label">${s.label}</span>
    <h1>${s.title}</h1>
    <div class="subtitle">SKILL FOCUS: ${s.skill.toUpperCase()}</div>
    <div class="q-progress">QUESTION ${questionIdx+1} OF ${s.questions.length} &mdash; answer all ${s.questions.length} correctly to earn your code word</div>
    <div class="prompt">${q.prompt}</div>
    <div class="options" id="opts"></div>
    <div class="feedback" id="fb"></div>
    <div class="code-reveal" id="codeReveal">
      <div class="word" id="codeWord"></div>
      <div class="caption" id="codeCaption"></div>
    </div>
    <button class="continue" id="continueBtn"></button>
  `;
  const optsDiv = document.getElementById('opts');
  q.options.forEach((opt, idx)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = opt.text;
    b.onclick = ()=>handleAnswer(idx);
    optsDiv.appendChild(b);
  });
}

function handleAnswer(idx){
  const s = stations[stationIdx];
  const q = s.questions[questionIdx];
  const opt = q.options[idx];
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b=>b.disabled = opt.correct);
  const chosenBtn = buttons[idx];
  const fb = document.getElementById('fb');
  fb.classList.add('show');
  fb.textContent = opt.fb;

  if(opt.correct){
    chosenBtn.classList.add('correct');
    fb.classList.add('good'); fb.classList.remove('bad');
    const isLastQuestion = questionIdx === s.questions.length - 1;
    const continueBtn = document.getElementById('continueBtn');
    continueBtn.classList.add('show');

    if(isLastQuestion){
      document.querySelector('.stamp').innerHTML = 'CLEARANCE<br>GRANTED';
      document.querySelector('.stamp').classList.add('granted');
      const cr = document.getElementById('codeReveal');
      cr.classList.add('show');
      document.getElementById('codeWord').textContent = s.code;
      document.getElementById('codeCaption').textContent = s.codeCaption;
      continueBtn.textContent = stationIdx < stations.length - 1 ? 'Continue to Next File \u2192' : 'See Final Combination \u2192';
      continueBtn.onclick = ()=>{
        collected.push(s.code);
        stationIdx++;
        if(stationIdx < stations.length){ phase='notes'; renderNotesPage(); }
        else { renderFinal(); }
        window.scrollTo(0,0);
      };
    } else {
      continueBtn.textContent = 'Next Question \u2192';
      continueBtn.onclick = ()=>{
        questionIdx++;
        renderQuestion();
        window.scrollTo(0,0);
      };
    }
  } else {
    chosenBtn.classList.add('wrong');
    fb.classList.add('bad'); fb.classList.remove('good');
    addPenalty();
    fb.textContent += ' (+1 minute penalty)';
    setTimeout(()=>{
      chosenBtn.disabled = false;
      chosenBtn.classList.remove('wrong');
      buttons.forEach(b=>{ if(!opt.correct) b.disabled = false; });
    }, 1400);
  }
}

function renderFinal(){
  document.getElementById('tabs').innerHTML = stations.map((s,i)=>`<div class="tab done">FILE ${i+1}</div>`).join('');
  clearInterval(clockInterval);
  const f = document.getElementById('folder');
  const letters = collected.map(c=>c[0]); // in station order — already a genuine scramble, not TRUST in order
  f.innerHTML = `
    <div class="final">
      <div class="stamp granted">CASE<br>NEARLY<br>CLOSED</div>
      <h1>Final Checkpoint</h1>
      <div class="subtitle">EQUAL JUSTICE RESEARCH INITIATIVE &mdash; ALL 5 FILES CLEARED</div>
      <p style="font-size:15px; line-height:1.6;">You cleared all five checkpoints (15 questions total). Here's the trail of code words you collected:</p>
      <div class="code-trail">
        ${collected.map(c=>`<div class="code-chip">${c}</div>`).join('')}
      </div>
      <p style="font-size:15px; line-height:1.6;">Each code word starts with one letter. Below are all five starting letters, in the order you earned them. Unscramble them to find the secret word that closes your case file.</p>
      <div class="final-word" id="scrambledLetters">${letters.join(' ')}</div>
      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
        <input type="text" id="unscrambleInput" placeholder="Type the unscrambled word..." style="font-family:'Courier New',monospace; font-size:16px; padding:10px 12px; border:2px solid var(--ink); border-radius:6px; flex:1; min-width:180px; letter-spacing:2px; text-transform:uppercase;">
        <button class="restart" id="checkAnswerBtn" style="margin-top:0;">Check Answer</button>
      </div>
      <div class="feedback" id="finalFb"></div>
      <div id="finalReveal" style="display:none;">
        <p style="font-size:15px; line-height:1.6; margin-top:14px;">You can <b>TRUST</b> the research you gather this way &mdash; it's tracked down, screened, translated, referenced, and tightened up. That's exactly what you'll need for your Just Mercy essay.</p>
        <p id="finalTimeLine" style="font-family:'Courier New',monospace; font-size:13px; color:var(--navy);"></p>
      </div>
      <button class="restart" onclick="restart()" style="margin-top:14px;">Restart Escape Room</button>
    </div>
  `;
  document.getElementById('checkAnswerBtn').onclick = ()=>{
    const val = document.getElementById('unscrambleInput').value.trim().toUpperCase();
    const fb = document.getElementById('finalFb');
    fb.classList.add('show');
    if(val === 'TRUST'){
      fb.classList.add('good'); fb.classList.remove('bad');
      fb.textContent = 'Correct! Case file unlocked.';
      document.getElementById('finalReveal').style.display = 'block';
      document.getElementById('finalTimeLine').textContent = 'Final time: ' + formatTime(getElapsed());
      document.getElementById('checkAnswerBtn').disabled = true;
      document.getElementById('unscrambleInput').disabled = true;
    } else {
      fb.classList.add('bad'); fb.classList.remove('good');
      fb.textContent = 'Not quite \u2014 rearrange the letters above and try again.';
    }
  };
}

function restart(){
  stationIdx = 0;
  phase = 'notes';
  questionIdx = 0;
  collected = [];
  startTime = Date.now();
  penaltySeconds = 0;
  const pd = document.getElementById('penaltyDisplay');
  if(pd) pd.textContent = '';
  startClock();
  renderNotesPage();
  window.scrollTo(0,0);
}

startClock();
renderNotesPage();
</script>
</body>
</html>
